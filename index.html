ff}.dayButtons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.dayButtons button{background:#1c2a3b;border:1px solid #35465c;border-radius:12px;color:#d1ddeb;padding:11px 2px;font-size:13px}.dayButtons button.active{background:#225b80;border-color:#70c1ff;color:#fff}.history{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a3b4e;padding:11px 0;gap:10px}.history:last-child{border:0}.history b{font-variant-numeric:tabular-nums}.chart{width:100%;height:185px;display:block}.hidden{display:none!important}.toast{position:fixed;left:50%;bottom:calc(87px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#d6edff;color:#102234;padding:10px 18px;border-radius:12px;z-index:15;box-shadow:0 8px 30px #0007;font-weight:700;white-space:nowrap}.help{font-size:12px;color:#8195ad}.divider{border:0;border-top:1px solid #2a3a4e;margin:18px 0}input[type=date]{color-scheme:dark}.progress{height:8px;background:#283b50;border-radius:40px;overflow:hidden}.progress div{height:100%;background:#79bdff;border-radius:40px}.empty{padding:24px 12px;text-align:center;color:#9bacc0}.footertext{font-size:12px;color:#8299af;line-height:1.5;text-align:center;padding:10px}.tag{font-size:11px;background:#283e53;color:#a9cfff;padding:4px 8px;border-radius:20px}

<body><header class="top"><div class="wrap headerrow"><div><div class="eyebrow">Your 12-week transformation</div><div class="headline" id="pageTitle">Overview</div></div><div class="pill" id="weekPill">Week 1 of 12</div></div></header><main class="wrap content" id="view"></main><nav class="nav" id="nav"><button data-tab="home"><span>⌂</span>Home</button><button data-tab="weight"><span>⚖</span>Weight</button><button data-tab="train"><span>▣</span>Workout</button><button data-tab="progress"><span>↗</span>Progress</button></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
(function(){'use strict';
const KEY='henry12-ios-v1';const INITIAL='2026-11-09';const plans=[{day:'Mon',title:'Upper A · Chest & Back',ex:[['Incline DB Press',3,'6–10'],['Lat Pulldown',3,'8–12'],['Flat Chest Press',3,'8–12'],['Seated Cable Row',3,'8–12'],['Lateral Raise',3,'12–20'],['Triceps Pushdown',2,'10–15'],['Biceps Curl',2,'10–15']]},{day:'Tue',title:'Lower A · Quads',ex:[['Squat / Leg Press',3,'6–10'],['Romanian Deadlift',3,'8–10'],['Leg Extension',2,'10–15'],['Seated Leg Curl',3,'10–15'],['Calf Raise',3,'12–20'],['Cable Crunch',3,'10–15']]},{day:'Thu',title:'Upper B · Shoulders & Back',ex:[['Shoulder Press',3,'6–10'],['Pull-up / Pulldown',3,'8–12'],['Incline Machine Press',3,'8–12'],['Chest-Supported Row',3,'8–12'],['Lateral Raise',3,'12–20'],['Rear Delt Fly',3,'12–20'],['Hammer Curl',2,'10–15'],['Overhead Triceps Ext',2,'10–15']]},{day:'Fri',title:'Lower B · Glutes & Hamstrings',ex:[['Hack Squat',3,'8–12'],['Hip Thrust',3,'8–12'],['Walking Lunge',2,'10/leg'],['Lying Leg Curl',3,'10–15'],['Calf Raise',3,'12–20'],['Hanging Knee Raise',3,'10–15']]}];
const $=s=>document.querySelector(s);let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){};if(!state||!state.version)state={version:1,start:INITIAL,weights:{},workouts:{}};state.weights ||= {};state.workouts ||= {};state.start ||= INITIAL;let tab='home',chosenDate=localDay(new Date()),selectedWeek=1,chosenPlan=0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localDay(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function fromDay(s){return new Date(s+'T12:00:00')}function offset(s,n){let d=fromDay(s);d.setDate(d.getDate()+n);return localDay(d)}function dayDiff(a,b){return Math.round((fromDay(a)-fromDay(b))/86400000)}function weekFor(s){return Math.floor(dayDiff(s,state.start)/7)+1}function inPlan(s){return weekFor(s)>=1&&weekFor(s)<=12}function planEnd(){return offset(state.start,83)}function fmt(s,opt){return fromDay(s).toLocaleDateString(undefined,opt||{month:'short',day:'numeric'})}function todayRange(){let w=weekFor(chosenDate);return Math.max(1,Math.min(12,w))}function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('Storage unavailable — export a backup');return false}}function notify(s){let el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.add('hidden'),2400)}function weekDates(w){return Array.from({length:7},(_,i)=>offset(state.start,(w-1)*7+i))}function allWeights(){return Object.entries(state.weights).filter(([d,v])=>inPlan(d)&&v!==''&&Number.isFinite(+v)).sort((a,b)=>a[0].localeCompare(b[0]))}function weightsAvg(arr){return arr.length?(arr.reduce((a,[,v])=>a+Number(v),0)/arr.length):null}function workoutKey(w,p){return `${w}-${p}`}function getWorkout(w,p){return state.workouts[workoutKey(w,p)]||{}}function setWorkout(w,p,data){state.workouts[workoutKey(w,p)]=data;save()}function weekLogged(w){let count=0;for(let p=0;p<4;p++){const data=getWorkout(w,p);if(Object.values(data).some(sets=>Array.isArray(sets)&&sets.some(s=>s.reps||s.weight)))count++}return count}
function chart(series){if(series.length===0)return '<div class="empty">No weigh-ins yet. Your trend will appear here.</div>';let vals=series.map(x=>Number(x[1]));let min=Math.min(...vals)-1,max=Math.max(...vals)+1;if(max<=min)max=min+1;let W=350,H=155,P=16,pts=series.map((x,i)=>[P+(i/Math.max(series.length-1,1))*(W-P*2),H-P-(vals[i]-min)/(max-min)*(H-2*P)]);let path=pts.map((p,i)=>(i?'L':'M')+p.map(v=>v.toFixed(1)).join(',')).join(' ');return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Morning weight trend"><path d="M${P} ${H-P} H${W-P}" stroke="#394e62" fill="none" stroke-width="1"/><path d="${path}" fill="none" stroke="#79bfff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${series.length>30?1.8:3}" fill="#a7d8ff"/>`).join('')}<text x="${P}" y="12" fill="#9bb3ca" font-size="10">${max.toFixed(1)} lb</text><text x="${P}" y="${H-3}" fill="#9bb3ca" font-size="10">${min.toFixed(1)} lb</text></svg>`}
function home(){let w=todayRange(),entries=allWeights(),current=state.weights[chosenDate]||'',start=entries[0],latest=entries[entries.length-1],delta=start&&latest?(Number(latest[1])-Number(start[1])):null;return `<div class="card"><div class="between"><div><div class="label">Today's morning weight</div><div class="big">${current?esc(current)+' <small style="font-size:17px">lb</small>':'—'}</div><div class="sub">${fmt(chosenDate,{weekday:'long',month:'short',day:'numeric'})}</div></div><button class="primary" data-go="weight">Log weight</button></div></div><div class="grid2"><div class="stat"><div class="label">Weight change</div><strong>${delta===null?'—':(delta>0?'+':'')+delta.toFixed(1)+' lb'}</strong><div class="sub">First to latest</div></div><div class="stat"><div class="label">Workouts logged</div><strong>${Object.entries(state.workouts).filter(([key,obj])=>Object.values(obj).some(sets=>Array.isArray(sets)&&sets.some(s=>s.reps||s.weight))).length} / 48</strong><div class="sub">Across 12 weeks</div></div></div><div class="sectiontitle">This week</div><div class="card"><div class="between"><b>Week ${w}</b><span class="tag">${weekLogged(w)} / 4 workouts</span></div><div class="progress" style="margin:14px 0"><div style="width:${weekLogged(w)*25}%"></div></div><div class="sub">${fmt(offset(state.start,(w-1)*7))} – ${fmt(offset(state.start,w*7-1))}</div><button class="primary" data-go="train" style="margin-top:16px;width:100%">Open workout log</button></div><div class="sectiontitle">Weight trend</div><div class="card">${chart(entries)}<button class="quiet" data-go="progress">See 12-week progress →</button></div><div class="footertext">Your entries are stored on this device/browser. Export backups regularly, especially before clearing browser data.</div>`}
function weightPage(){let w=todayRange(),dates=weekDates(w),listed=allWeights().slice().reverse().slice(0,12);return `<div class="card"><div class="label">Morning weigh-in · pounds</div><div style="margin:7px 0 12px" class="sub">Log after using the bathroom, before breakfast, using the same scale.</div><div class="flex"><input type="date" id="weightDate" class="field grow" value="${chosenDate}" min="${state.start}" max="${planEnd()}"></div><div class="flex" style="margin-top:12px"><input inputmode="decimal" type="number" step="0.1" min="50" max="700" id="weightInput" class="field" placeholder="e.g. 170.0" value="${esc(state.weights[chosenDate]??'')}" aria-label="Body weight in pounds"><button id="saveWeight" class="primary">Save</button></div><button class="quiet danger" id="deleteWeight" style="margin-top:7px">Clear this date</button></div><div class="sectiontitle">Week ${w} weigh-ins</div><div class="card"><div class="dateRow">${dates.map(d=>`<button data-date="${d}" class="${d===chosenDate?'selected':''}"><small>${fmt(d,{weekday:'short'})}</small><b>${fromDay(d).getDate()}</b><small>${state.weights[d]?esc(state.weights[d])+' lb':'—'}</small></button>`).join('')}</div><div class="sub">Tap a date to log or correct its weight.</div></div><div class="sectiontitle">Recent entries</div><div class="card">${listed.length?listed.map(([date,v])=>`<div class="history"><span>${fmt(date,{weekday:'short',month:'short',day:'numeric'})}</span><b>${esc(v)} lb</b></div>`).join(''):'<div class="empty">No weigh-ins yet.</div>'}</div>`}
function trainPage(){let w=selectedWeek,plan=plans[chosenPlan],data=getWorkout(w,chosenPlan);return `<div class="sectiontitle" style="margin-top:0">Choose a week</div><div class="weekButtons">${Array.from({length:12},(_,i)=>`<button class="${w===i+1?'active':''}" data-week="${i+1}">${i+1}</button>`).join('')}</div><div class="sub" style="margin:11px 0 16px">Week ${w}: ${fmt(offset(state.start,(w-1)*7))} – ${fmt(offset(state.start,w*7-1))}</div><div class="sectiontitle">Workout day</div><div class="dayButtons">${plans.map((p,i)=>`<button class="${chosenPlan===i?'active':''}" data-plan="${i}">${p.day}</button>`).join('')}</div><div class="card" style="margin-top:15px"><div class="between"><div><div class="label">${plan.day} · Week ${w}</div><div class="sectiontitle" style="margin:6px 0">${plan.title}</div></div><span class="tag">Autosaved</span></div><p class="sub">Enter the weight (lb) and reps completed for each set. You can leave a set blank. Changes save automatically.</p>${plan.ex.map(([name,n,reps],i)=>{let sets=data[i]||Array.from({length:n},()=>({weight:'',reps:''}));let previous=null;for(let prior=w-1;prior>=1;prior--){let a=getWorkout(prior,chosenPlan)[i];if(a&&a.some(s=>s.weight&&s.reps)){previous=a;break}}return `<div class="exercise"><div class="between"><div><div class="exname">${esc(name)}</div><div class="last">Target: ${n} sets × ${reps} reps${previous?' · Last: '+esc(previous.filter(s=>s.weight&&s.reps).map(s=>s.weight+'×'+s.reps).join(', ')):''}</div></div></div><div class="sethead"><span>Set</span><span>Weight (lb)</span><span>Reps</span><span></span></div>${sets.map((s,j)=>setInputs(i,j,s)).join('')}<button class="secondary addSet" data-add="${i}">+ Add set</button></div>`}).join('')}</div>`}
function setInputs(i,j,s){return `<div class="setrow"><span class="setno">${j+1}</span><input class="field set-input" type="number" inputmode="decimal" min="0" step="0.5" placeholder="lb" value="${esc(s.weight??'')}" data-ex="${i}" data-set="${j}" data-field="weight" aria-label="Set ${j+1} weight"><input class="field set-input" type="number" inputmode="numeric" min="0" step="1" placeholder="reps" value="${esc(s.reps??'')}" data-ex="${i}" data-set="${j}" data-field="reps" aria-label="Set ${j+1} reps"><button class="remove" data-remove="${i},${j}" aria-label="Remove set">×</button></div>`}
function progressPage(){let entries=allWeights(),weekly=Array.from({length:12},(_,i)=>{let w=i+1;let av=weightsAvg(entries.filter(([date])=>weekFor(date)===w));return {w,avg:av,days:entries.filter(([d])=>weekFor(d)===w).length,workouts:weekLogged(w)}});return `<div class="card"><div class="label">Bodyweight · all 12 weeks</div>${chart(entries)}<div class="sub">Daily fluctuations are normal; weekly averages show your trend better.</div></div><div class="sectiontitle">Weekly progress</div><div class="card">${weekly.map(row=>`<div class="history"><div><b>Week ${row.w}</b><div class="sub">${row.days}/7 weigh-ins · ${row.workouts}/4 workouts</div></div><b>${row.avg===null?'—':row.avg.toFixed(1)+' lb'}</b></div>`).join('')}</div><div class="sectiontitle">Settings & backup</div><div class="card"><label class="label" for="startDate">12-week start date</label><div class="flex" style="margin-top:9px"><input class="field" type="date" id="startDate" value="${esc(state.start)}"><button class="secondary" id="saveStart">Update</button></div><p class="help">Changing your start date changes which dates belong to the 12-week program. Logged workouts stay assigned to their week numbers.</p><hr class="divider"><div class="stack"><button class="secondary" id="exportJson">Export full backup (.json)</button><button class="secondary" id="exportCsv">Export weight + workout CSV files</button><label class="secondary" style="text-align:center;cursor:pointer">Import a backup (.json)<input type="file" id="importJson" accept="application/json,.json" hidden></label></div><p class="help">Data is stored locally, not synced between devices. Export a backup regularly. Keep your backup file private.</p><hr class="divider"><button class="quiet danger" id="resetAll">Erase all logged data</button></div>`}
function render(){let w=Math.min(12,Math.max(1,weekFor(localDay(new Date()))));$('#pageTitle').textContent={home:'Overview',weight:'Morning weight',train:'Workout log',progress:'Your progress'}[tab];$('#weekPill').textContent=`Week ${w} of 12`;$('#view').innerHTML=({home,weight:weightPage,train:trainPage,progress:progressPage})[tab]();document.querySelectorAll('[data-tab]').forEach(btn=>btn.classList.toggle('active',btn.dataset.tab===tab));}
function go(t){tab=t;if(t==='train')selectedWeek=todayRange();render();window.scrollTo(0,0)}
document.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.tab){go(el.dataset.tab);return}if(el.dataset.go){go(el.dataset.go);return}if(el.dataset.date){chosenDate=el.dataset.date;render();return}if(el.dataset.week){selectedWeek=Number(el.dataset.week);render();return}if(el.dataset.plan){chosenPlan=Number(el.dataset.plan);render();return}if(el.id==='saveWeight'){let v=$('#weightInput').value.trim();if(!inPlan(chosenDate))return notify('Pick a date within 12 weeks');if(v===''||!Number.isFinite(+v)||+v<50||+v>700)return notify('Enter a valid weight in lb');state.weights[chosenDate]=String(Number(v));if(save())notify('Morning weight saved');render();return}if(el.id==='deleteWeight'){delete state.weights[chosenDate];save();render();return}if(el.dataset.add!==undefined){let i=Number(el.dataset.add),data=getWorkout(selectedWeek,chosenPlan);let d=data[i]||Array.from({length:plans[chosenPlan].ex[i][1]},()=>({weight:'',reps:''}));d.push({weight:'',reps:''});data[i]=d;setWorkout(selectedWeek,chosenPlan,data);render();return}if(el.dataset.remove){let [i,j]=el.dataset.remove.split(',').map(Number);let data=getWorkout(selectedWeek,chosenPlan);let d=data[i]||Array.from({length:plans[chosenPlan].ex[i][1]},()=>({weight:'',reps:''}));if(d.length<=1)return notify('Keep at least one set');d.splice(j,1);data[i]=d;setWorkout(selectedWeek,chosenPlan,data);render();return}if(el.id==='saveStart'){let value=$('#startDate').value;if(!value)return;state.start=value;save();chosenDate=offset(value,0);selectedWeek=1;render();notify('Start date updated');return}if(el.id==='resetAll'){if(confirm('Erase all weight and workout logs? This cannot be undone unless you have a backup.')){state.weights={};state.workouts={};save();render();notify('Logs erased')}return}if(el.id==='exportJson'){download('12-week-log-backup.json',JSON.stringify(state,null,2),'application/json');notify('Backup exported');return}if(el.id==='exportCsv'){let wrows=[['date','week','bodyweight_lb'],...allWeights().map(([date,weight])=>[date,weekFor(date),weight])];let xrows=[['week','day','exercise','set','weight_lb','reps']];for(let w=1;w<=12;w++)plans.forEach((p,i)=>{let dat=getWorkout(w,i);p.ex.forEach(([name],ex)=>{(dat[ex]||[]).forEach((s,j)=>{if(s.weight!==''||s.reps!=='')xrows.push([w,p.day,name,j+1,s.weight,s.reps])})})});download('morning-weights.csv',toCsv(wrows),'text/csv');setTimeout(()=>download('workout-sets.csv',toCsv(xrows),'text/csv'),250);notify('CSV files exported');return}});
document.addEventListener('input',e=>{const input=e.target;if(!input.classList.contains('set-input'))return;let i=Number(input.dataset.ex),j=Number(input.dataset.set),field=input.dataset.field,data=getWorkout(selectedWeek,chosenPlan);let sets=data[i]||Array.from({length:plans[chosenPlan].ex[i][1]},()=>({weight:'',reps:''}));if(!sets[j])sets[j]={weight:'',reps:''};let v=input.value;if(v!==''&&(+v<0||+v>10000))return;sets[j][field]=v;data[i]=sets;setWorkout(selectedWeek,chosenPlan,data)});
document.addEventListener('change',async e=>{let input=e.target;if(input.id==='weightDate'){chosenDate=input.value;if(!inPlan(chosenDate)){notify('Choose a date in your program');chosenDate=state.start}render()}if(input.id==='importJson'&&input.files[0]){try{let file=JSON.parse(await input.files[0].text());if(file.version!==1||typeof file.weights!=='object'||typeof file.workouts!=='object'||!/^\d{4}-\d\d-\d\d$/.test(file.start))throw Error('Invalid backup');if(confirm('Replace all current logs with this backup?')){state=file;save();render();notify('Backup imported')}}catch(err){notify('Could not read backup')}}});
